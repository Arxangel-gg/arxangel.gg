# ============================================================================
# ARXANGEL — Netlify configuration
# Use this when deploying via Git with the base directory set to "site".
# (For drag-and-drop deploys this file is ignored; the _headers file still
#  applies. See README for both deployment paths.)
# ============================================================================

[build]
  # The site is fully static & pre-optimized — no build step.
  publish = "."
  command = ""

# Assets are already minified/optimized by us; skip Netlify post-processing
# so nothing is altered.
[build.processing]
  skip_processing = true

# Optional serverless function that auto-populates the playlist from Spotify.
# Harmless if you never add SPOTIFY_CLIENT_ID/SECRET env vars — it just returns
# 503 and the site falls back to data/releases.json. See README §7.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
